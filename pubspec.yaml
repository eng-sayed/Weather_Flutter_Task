name: task_flutter
description: "Weather Forecast Application"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  intl: ^0.20.0

  bloc: ^8.1.2
  flutter_bloc: ^8.1.3
  
  dio: ^5.8.0+1
  pretty_dio_logger: ^1.4.0
  
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^9.2.4
  
  get_it: ^7.6.0
  
  cached_network_image: ^3.2.3
  flutter_svg: ^2.0.7
  shimmer: ^3.0.0
  lottie: ^2.0.1
  animated_widgets_flutter: ^1.1.1+2
  
  responsive_framework: ^1.5.1
  
  flutter_smart_dialog: ^4.9.8+9
  bot_toast: ^4.1.3
  
  permission_handler: ^12.0.1
  image_picker: ^1.1.2
  file_picker: ^10.2.0
  
  dotted_border: ^3.1.0
  chewie: ^1.12.1
  video_player: ^2.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  hive_generator: ^2.0.0
  build_runner: ^2.4.6

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/images/
    - assets/json/
    - assets/fonts/
    - assets/icons/
